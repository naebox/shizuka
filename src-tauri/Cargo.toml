[package]
name = "shizuka"
version = "0.5.0"
description = "Shizuka — Local Real-Time AI Microphone Noise Cancellation powered by DeepFilterNet3 + Neural VAD Gate"
authors = ["naebox"]
edition = "2021"

[lib]
name = "shizuka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

# Cross-platform low-latency audio & lock-free buffers
cpal = "0.17"
ringbuf = "0.4"
rubato = "0.16"
audio_thread_priority = "0.34"
sonora = "0.3"

# DeepFilterNet3 native Rust engine (Low-Latency 0-lookahead model bundled)
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", package = "deep_filter", default-features = false, features = ["tract", "default-model-ll"] }
# Pin tract sub-crates to 0.21.4 (the exact version DeepFilterNet3 libDF targets before tract's 0.21.8+ breaking API change)
tract-onnx = "=0.21.4"
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-pulse = "=0.21.4"
tract-data = "=0.21.4"
tract-linalg = "=0.21.4"
tract-onnx-opl = "=0.21.4"
ndarray = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14", default-features = false, features = ["core_audio", "audio_toolbox"] }
objc2 = "0.6"
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AUComponent", "AudioUnitProperties"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

# Important: build dependencies (tract / rubato / deep_filter) with opt-level = 3 and debug-assertions = false
# so real-time 10ms budget never glitches AND tract-core 0.21.4 does not trip its debug-only duplicate const name
# assertion (`/convt3/Conv.bias`) when loading official DeepFilterNet3_onnx.tar.gz!
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[profile.test.package."*"]
opt-level = 3
debug-assertions = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Keep real-time 10ms audio inference & DSP hot-path crates at maximum optimization (-O3)
[profile.release.package.deep_filter]
opt-level = 3
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.rubato]
opt-level = 3
[profile.release.package.realfft]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
[profile.release.package.ndarray]
opt-level = 3
[profile.release.package.sonora]
opt-level = 3
[profile.release.package.sonora-aec3]
opt-level = 3
[profile.release.package.sonora-common-audio]
opt-level = 3
[profile.release.package.sonora-fft]
opt-level = 3
[profile.release.package.sonora-simd]
opt-level = 3

# Startup-only ONNX/NNEF graph loaders (run once at launch, never in the 10ms audio loop)
[profile.release.package.tract-nnef]
opt-level = 1
[profile.release.package.tract-hir]
opt-level = 1
[profile.release.package.tract-onnx]
opt-level = 1
[profile.release.package.tract-onnx-opl]
opt-level = 1
[profile.release.package.tract-pulse]
opt-level = 1
[profile.release.package.tract-pulse-opl]
opt-level = 1
