name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript & Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

  rust:
    name: Rust (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Windows x64"
            platform: windows-latest
            os_kind: windows
          - label: "macOS"
            platform: macos-latest
            os_kind: macos
    steps:
      - name: Disable Windows Defender real-time scanning (faster MSVC builds)
        if: matrix.os_kind == 'windows'
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:TEMP -ErrorAction SilentlyContinue
          } catch {}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust stable (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-${{ matrix.label }}

      - name: Ensure frontend dist placeholder for Tauri compile-time macro
        shell: bash
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo "<!doctype html><html><body></body></html>" > dist/index.html

      - name: Build Universal macOS HAL driver (compile verification)
        if: matrix.os_kind == 'macos'
        shell: bash
        run: bash drivers/macos-hal/build_driver.sh /tmp/ShizukaAudio.driver

      - name: Run cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
