name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Leave empty to use v<version> from package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          ## Shizuka — ローカル完結・リアルタイム AI マイクノイズキャンセリング

          ### ダウンロード
          - **Windows（推奨・インストーラ）**: `Shizuka_*_x64-setup.exe`
          - **Windows（ポータブル版・インストール不要）**: `Shizuka_*_windows_x64_portable.zip`
          - **Windows（MSI パッケージ）**: `Shizuka_*_x64_en-US.msi`
          - **macOS（Apple Silicon / M1〜M4）**: `Shizuka_*_aarch64.dmg`
          - **macOS（Intel）**: `Shizuka_*_x64.dmg`

          > [!NOTE]
          > 個人ビルド（未署名）のため、初回起動時に OS の警告が表示される場合があります。
          > - **Windows**: SmartScreen が表示された場合は「詳細情報」→「実行」を選択してください。
          > - **macOS**: 初回はアプリを右クリック →「開く」（または「システム設定 → プライバシーとセキュリティ → このまま開く」）から起動してください。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing and refreshing assets."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Shizuka $TAG" \
              --notes "$NOTES"
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Windows x64"
            platform: windows-latest
            target: ""
            os_kind: windows
          - label: "macOS Apple Silicon"
            platform: macos-latest
            target: aarch64-apple-darwin
            os_kind: macos
          - label: "macOS Intel"
            platform: macos-latest
            target: x86_64-apple-darwin
            os_kind: macos

    steps:
      - name: Disable Windows Defender real-time scanning (faster MSVC builds)
        if: matrix.os_kind == 'windows'
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:TEMP, "$env:LOCALAPPDATA\tauri" -ErrorAction SilentlyContinue
          } catch {}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}-lld

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application (Windows)
        if: matrix.os_kind == 'windows'
        env:
          RUSTFLAGS: "-C linker=rust-lld.exe -C linker-flavor=lld-link"
        run: npm run tauri build

      - name: Build Tauri application (macOS)
        if: matrix.os_kind == 'macos'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Package and upload Windows artifacts
        if: matrix.os_kind == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $assets = @()
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          $portableDir = "portable_stage"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/shizuka.exe" "$portableDir/Shizuka.exe"
          Copy-Item "LICENSE" "$portableDir/LICENSE"
          Copy-Item "README.md" "$portableDir/README.md"
          $zipPath = "Shizuka_${env:VERSION}_windows_x64_portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          $assets += (Resolve-Path $zipPath).Path

          if ($assets.Count -eq 0) {
            throw "No Windows build artifacts found!"
          }
          Write-Host "Uploading Windows assets:"
          $assets | ForEach-Object { Write-Host "  $_" }
          gh release upload "$env:TAG" $assets --clobber

          # Prune large installer bundles before Post Rust cache archives target/
          Remove-Item -Recurse -Force "src-tauri/target/release/bundle", "src-tauri/target/release/wix", "src-tauri/target/release/nsis", "src-tauri/target/release/shizuka.exe", "$portableDir", "$zipPath" -ErrorAction SilentlyContinue

      - name: Upload macOS artifacts
        if: matrix.os_kind == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          ASSETS=(src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No macOS DMG artifacts found in src-tauri/target/${TARGET}/release/bundle/dmg/"
            exit 1
          fi
          echo "Uploading macOS assets:"
          printf '  %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          rm -rf "src-tauri/target/${TARGET}/release/bundle"
