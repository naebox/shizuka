name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0). Leave empty to use v<version> from package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version, validate manifests, and extract CHANGELOG.md notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_ARG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_ARG="${{ inputs.tag }}"
          else
            TAG_ARG=""
          fi

          if [ -n "$TAG_ARG" ]; then
            node scripts/extract-release-notes.mjs \
              --check-manifests \
              --tag "$TAG_ARG" \
              --github-output "$GITHUB_OUTPUT" \
              --markdown-out release_notes.md
          else
            node scripts/extract-release-notes.mjs \
              --check-manifests \
              --github-output "$GITHUB_OUTPUT" \
              --markdown-out release_notes.md
          fi

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing title and release notes."
            gh release edit "$TAG" \
              --title "Shizuka $TAG" \
              --notes-file release_notes.md
          else
            # Create as draft so /releases/latest/download/latest.json never returns 404
            # while platform builds are still running; finalize-release publishes atomically.
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Shizuka $TAG" \
              --notes-file release_notes.md
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Windows x64"
            platform: windows-latest
            target: ""
            os_kind: windows
            updater_target: windows-x86_64
            arch_label: x64
          - label: "macOS Apple Silicon"
            platform: macos-latest
            target: aarch64-apple-darwin
            os_kind: macos
            updater_target: darwin-aarch64
            arch_label: aarch64
          - label: "macOS Intel"
            platform: macos-latest
            target: x86_64-apple-darwin
            os_kind: macos
            updater_target: darwin-x86_64
            arch_label: x64

    steps:
      - name: Disable Windows Defender real-time scanning (faster MSVC builds)
        if: matrix.os_kind == 'windows'
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:TEMP, "$env:LOCALAPPDATA\tauri" -ErrorAction SilentlyContinue
          } catch {}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup pinned Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}-lld

      - name: Install frontend dependencies
        run: npm ci

      - name: Prebuild Universal macOS HAL driver (ShizukaAudio.driver)
        if: matrix.os_kind == 'macos'
        shell: bash
        run: bash drivers/macos-hal/build_driver.sh src-tauri/resources/ShizukaAudio.driver

      - name: Build Tauri application (Windows)
        if: matrix.os_kind == 'windows'
        env:
          RUSTFLAGS: "-C linker=rust-lld.exe -C linker-flavor=lld-link"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json

      - name: Build Tauri application (macOS)
        if: matrix.os_kind == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --config src-tauri/tauri.macos.release.conf.json

      - name: Package and upload Windows artifacts
        if: matrix.os_kind == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATER_TARGET: ${{ matrix.updater_target }}
        run: |
          $nsisExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisSig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiFile = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiSig = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.sig" -ErrorAction SilentlyContinue | Select-Object -First 1

          $assets = @()
          if ($nsisExe) { $assets += $nsisExe.FullName }
          if ($msiFile) { $assets += $msiFile.FullName }

          $portableDir = "portable_stage"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/shizuka.exe" "$portableDir/Shizuka.exe"
          Copy-Item "LICENSE" "$portableDir/LICENSE"
          Copy-Item "README.md" "$portableDir/README.md"
          Copy-Item "README.en.md" "$portableDir/README.en.md"
          New-Item -ItemType File -Force "$portableDir/.portable" | Out-Null
          $zipPath = "Shizuka_${env:VERSION}_windows_x64_portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          $assets += (Resolve-Path $zipPath).Path

          if ($assets.Count -eq 0) {
            throw "No Windows build artifacts found!"
          }
          Write-Host "Uploading Windows assets:"
          $assets | ForEach-Object { Write-Host "  $_" }
          gh release upload "$env:TAG" $assets --clobber

          if (-not $nsisExe -or -not $nsisSig) {
            throw "Expected NSIS updater installer (.exe) and signature (.exe.sig) were not generated!"
          }
          New-Item -ItemType Directory -Force "updater_meta" | Out-Null
          $nsisSigContent = (Get-Content -Raw $nsisSig.FullName).Trim()
          foreach ($t in @($env:UPDATER_TARGET, "$($env:UPDATER_TARGET)-nsis")) {
            @{
              target    = $t
              file      = $nsisExe.Name
              signature = $nsisSigContent
            } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "updater_meta/${t}.json"
          }
          if ($msiFile -and $msiSig) {
            $msiTarget = "$($env:UPDATER_TARGET)-msi"
            @{
              target    = $msiTarget
              file      = $msiFile.Name
              signature = (Get-Content -Raw $msiSig.FullName).Trim()
            } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "updater_meta/${msiTarget}.json"
          }

          # Prune large installer bundles before Post Rust cache archives target/
          Remove-Item -Recurse -Force "src-tauri/target/release/bundle", "src-tauri/target/release/wix", "src-tauri/target/release/nsis", "src-tauri/target/release/shizuka.exe", "$portableDir", "$zipPath" -ErrorAction SilentlyContinue

      - name: Package and upload macOS artifacts
        if: matrix.os_kind == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          UPDATER_TARGET: ${{ matrix.updater_target }}
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          shopt -s nullglob
          DMGS=(src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg)
          TARBALLS=(src-tauri/target/${TARGET}/release/bundle/macos/*.app.tar.gz)
          SIGS=(src-tauri/target/${TARGET}/release/bundle/macos/*.app.tar.gz.sig)

          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "No macOS DMG artifacts found in src-tauri/target/${TARGET}/release/bundle/dmg/"
            exit 1
          fi
          if [ ${#TARBALLS[@]} -eq 0 ] || [ ${#SIGS[@]} -eq 0 ]; then
            echo "No macOS updater artifacts (.app.tar.gz / .sig) found!"
            exit 1
          fi

          # Rename architecture-specific updater tarball so arm64 & x64 do not collide on GitHub Release
          UPDATER_TAR_NAME="Shizuka_${VERSION}_${ARCH_LABEL}.app.tar.gz"
          cp "${TARBALLS[0]}" "${UPDATER_TAR_NAME}"

          echo "Uploading macOS assets:"
          printf '  %s\n' "${DMGS[@]}" "${UPDATER_TAR_NAME}"
          gh release upload "$TAG" "${DMGS[@]}" "${UPDATER_TAR_NAME}" --clobber

          mkdir -p updater_meta
          SIG_CONTENT=$(tr -d '\r\n' < "${SIGS[0]}")
          UPDATER_TAR_NAME="${UPDATER_TAR_NAME}" SIG_CONTENT="${SIG_CONTENT}" node -e '
            const fs = require("fs");
            const meta = {
              target: process.env.UPDATER_TARGET,
              file: process.env.UPDATER_TAR_NAME,
              signature: process.env.SIG_CONTENT,
            };
            fs.writeFileSync(`updater_meta/${process.env.UPDATER_TARGET}.json`, JSON.stringify(meta, null, 2));
          '

          rm -rf "src-tauri/target/${TARGET}/release/bundle" "src-tauri/resources/ShizukaAudio.driver" "${UPDATER_TAR_NAME}"

      - name: Upload updater signature metadata
        uses: actions/upload-artifact@v7
        with:
          name: updater-meta-${{ matrix.updater_target }}
          path: updater_meta/*.json
          if-no-files-found: error

  finalize-release:
    name: Finalize Release (latest.json & SHA256SUMS.txt)
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download updater signature metadata
        uses: actions/download-artifact@v8
        with:
          pattern: updater-meta-*
          path: updater_meta
          merge-multiple: true

      - name: Generate latest.json & SHA256SUMS.txt and upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/extract-release-notes.mjs \
            --version "$VERSION" \
            --markdown-out release_notes.md \
            --summary-out updater_notes.txt

          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const repo = process.env.REPO;
          const metaDir = "updater_meta";
          const platforms = {};

          for (const entry of fs.readdirSync(metaDir)) {
            if (!entry.endsWith(".json")) continue;
            const item = JSON.parse(fs.readFileSync(path.join(metaDir, entry), "utf8"));
            platforms[item.target] = {
              signature: item.signature,
              url: `https://github.com/${repo}/releases/download/${tag}/${item.file}`,
            };
          }

          for (const reqTarget of ["windows-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
            if (!platforms[reqTarget]) {
              throw new Error(`Missing updater metadata for target: ${reqTarget}`);
            }
          }

          const notes = fs.readFileSync("updater_notes.txt", "utf8").trim();
          const latest = {
            version,
            notes,
            pub_date: new Date().toISOString(),
            platforms,
          };

          fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2) + "\n");
          console.log("Generated latest.json:");
          console.log(fs.readFileSync("latest.json", "utf8"));
          EOF

          mkdir -p release_assets
          gh release download "$TAG" \
            --dir release_assets \
            --pattern "*.exe" \
            --pattern "*.msi" \
            --pattern "*.zip" \
            --pattern "*.dmg" \
            --pattern "*.app.tar.gz"

          (
            cd release_assets
            LC_ALL=C sha256sum * > ../SHA256SUMS.txt
          )
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

          gh release upload "$TAG" latest.json SHA256SUMS.txt --clobber
          # Publish atomically only after all binaries, latest.json, and SHA256SUMS.txt are attached
          gh release edit "$TAG" \
            --title "Shizuka $TAG" \
            --notes-file release_notes.md \
            --draft=false
